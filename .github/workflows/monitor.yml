name: Toyoko Inn Vacancy Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# 前回の実行がまだ終わっていない場合、新しい実行は
# 強制終了させずに待たせる（キューイングする）。
# これにより、同時に複数のSeleniumプロセスが
# 同じサイトへアクセスして負荷・レート制限に
# 引っかかったり、state.jsonの取り合いでpushが
# 失敗したりする事故を防ぐ。
concurrency:
  group: toyoko-inn-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Selenium
        run: pip install selenium

      - name: Run monitor
        env:
          TOYOKO_PEOPLE: ${{ secrets.TOYOKO_PEOPLE }}
          TOYOKO_ROOMS: ${{ secrets.TOYOKO_ROOMS }}
          TOYOKO_SMOKING: ${{ secrets.TOYOKO_SMOKING }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}
          PYTHONUNBUFFERED: "1"          # ← この行を追加

        run: python -u monitor.py         # ← "python" を "python -u" に変更

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update vacancy state"
          git pull --rebase
          git push
