name: Toyoko Inn Vacancy Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Selenium
        run: pip install selenium

      - name: Run monitor
        env:
          TOYOKO_CHECKIN: ${{ secrets.TOYOKO_CHECKIN }}
          TOYOKO_CHECKOUT: ${{ secrets.TOYOKO_CHECKOUT }}
          TOYOKO_PEOPLE: ${{ secrets.TOYOKO_PEOPLE }}
          TOYOKO_ROOMS: ${{ secrets.TOYOKO_ROOMS }}
          TOYOKO_SMOKING: ${{ secrets.TOYOKO_SMOKING }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}

        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update vacancy state"
          git push
